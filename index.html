<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalamprios</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1 13 8 8 15 3 8z' fill='%23a98bff'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #170b2c;
      }
      #spiel {
        width: 100%;
        height: 100%;
      }

      /* Der Vollbild-Knopf unten links */
      #vollbild {
        position: fixed;
        left: 6px;
        bottom: 6px;
        width: 40px;
        height: 40px;
        padding: 7px;
        border: 2px solid #a98bff;
        border-radius: 10px;
        background: rgba(42, 22, 80, 0.85);
        color: #f6f0ff;
        cursor: pointer;
      }
      #vollbild[hidden] {
        display: none;
      }
      #vollbild svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #vollbild .zu,
      #vollbild.an .auf {
        display: none;
      }
      #vollbild.an .zu {
        display: block;
      }

      /* Am Handy hochkant: bitte quer halten */
      #querHalten {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #querHalten {
          display: flex;
          position: fixed;
          inset: 0;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          padding: 24px;
          background: #170b2c;
          color: #f6f0ff;
          font: 600 26px Fredoka, 'Trebuchet MS', sans-serif;
          text-align: center;
        }
        #querHalten svg {
          width: 90px;
          height: 90px;
          animation: drehen 2s ease-in-out infinite;
        }
      }
      @keyframes drehen {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
    </style>
  </head>
  <body>
    <div id="spiel"></div>

    <button id="vollbild" type="button" title="Vollbild" aria-label="Vollbild">
      <svg class="auf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
      <svg class="zu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" />
      </svg>
    </button>

    <div id="querHalten">
      <svg viewBox="0 0 24 24" fill="none" stroke="#a98bff" stroke-width="1.8" stroke-linejoin="round">
        <rect x="7" y="2" width="10" height="20" rx="2" />
        <path d="M11 18.5h2" stroke-linecap="round" />
      </svg>
      Bitte halte dein Handy quer.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
